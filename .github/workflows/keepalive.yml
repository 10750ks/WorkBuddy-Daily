name: Keepalive
on:
  schedule:
    - cron: '0 0 */15 * *'
  workflow_dispatch:

permissions:
  contents: write   # 关键！给仓库写入权限，才能生成空提交

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          commit_message: "keepalive: 保活，防止定时workflow被60天规则禁用"
