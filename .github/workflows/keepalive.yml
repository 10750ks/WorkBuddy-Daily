name: Keepalive
on:
  schedule:
    - cron: '0 0 */15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 生成空提交保活
        run: |
          git config --global user.name "10750ks"
          git config --global user.email "10750ks@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: 保活重置60天计时器"
          git push
